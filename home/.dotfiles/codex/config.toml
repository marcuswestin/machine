# Personal Codex defaults.
# Authentication and session files remain app-managed and machine-local.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
# Subagents do fan-out work: the fast, cheap tier at the same effort.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

# Allow routine commands and edits inside the active workspace.
# Requests outside that boundary are automatically reviewed.
default_permissions = ":workspace"
approval_policy = "on-request"
approvals_reviewer = "auto_review"


# Memories

notify = [
  "/Users/ro/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
]
# "fast" is the documented tier name; Codex sends it as `priority` (1.5x speed, more usage).
service_tier = "fast"

[features]
  memories = true
  js_repl = false

[memories]
  generate_memories = true
  use_memories = true


  # Installed plugins

