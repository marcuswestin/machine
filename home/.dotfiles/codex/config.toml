# Personal Codex defaults.
# Authentication and session files remain app-managed and machine-local.

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
service_tier = "default"

# Allow routine commands and edits inside the active workspace.
# Requests outside that boundary are automatically reviewed.
default_permissions = ":workspace"
approval_policy = "on-request"
approvals_reviewer = "auto_review"


# Memories

notify = ["/Users/ro/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[features]
memories = true
js_repl = false

[memories]
generate_memories = true
use_memories = true


# Installed plugins

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true


# Trusted projects

[projects."/Users/ro/code/machine"]
trust_level = "trusted"

[projects."/Users/ro/code/tao-lang"]
trust_level = "trusted"

[projects."/Users/ro/code/tao-lang-2"]
trust_level = "trusted"

[projects."/Users/ro/code/git-star"]
trust_level = "trusted"


# Useful desktop preferences

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
"notifications-turn-mode" = "always"
followUpQueueMode = "queue"
git-branch-prefix = "feat/"
git-pull-request-merge-method = "squash"
defaultTerminalLocation = "bottom"
show-context-window-usage = true

[desktop.open-in-target-preferences]
global = "cursor"


# Official OpenAI documentation

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false
