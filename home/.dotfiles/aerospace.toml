# Managed by chezmoi (symlink ~/.aerospace.toml → this file). Edit in-repo; reload AeroSpace (service mode: r).

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# AeroSpace is launched by modules/startup.nix instead of its own login item.
start-at-login = false

# Re-stagger Codex/Cursor windows after AeroSpace starts (e.g. restored windows).
#after-startup-command = [
#  'exec-and-forget ${HOME}/code/machine/scripts/aerospace-stagger-app-window.sh --app-id com.openai.codex --workspaces 1,2,3,4,5,6,7,8,9',
#  'exec-and-forget ${HOME}/code/machine/scripts/aerospace-stagger-app-window.sh --app-id com.todesktop.230313mzl4w4u92 --workspaces Q,W,E',
#]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Do not move the mouse when focus changes monitor (e.g. CLI/open focusing Chrome
# on another display). AeroSpace cannot distinguish that from Cmd-Tab, so keep this
# empty rather than `move-mouse monitor-lazy-center`.
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = []

# Disable macOS "Hide application" (cmd-h).
automatically-unhide-macos-hidden-apps = true

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = []

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# on-window-detected runs when a window is first seen (new window / AeroSpace (re)start), not on reload-config.
# Confirm bundle ids with: aerospace list-apps (also avoid a second config at ~/.config/aerospace/aerospace.toml).
# alt-z -> workspace Z (LG UltraFine): Chrome, iPhone/Android simulators.
[[on-window-detected]]
  if.app-id = 'com.google.Chrome'
  run = 'move-node-to-workspace Z'
[[on-window-detected]]
  if.app-id = 'com.apple.iphonesimulator'
  run = 'move-node-to-workspace Z'
[[on-window-detected]]
  # Android Emulator exposes no bundle id to AeroSpace; app name is the QEMU emulator process.
  if.app-name-regex-substring = '^qemu-system-'
  run = 'move-node-to-workspace Z'

# alt-a -> workspace A (LG UltraFine): Tao Studio.
[[on-window-detected]]
  if.app-id = 'dev.tao-lang.studio'
  run = 'move-node-to-workspace A'

# alt-x -> workspace X (LG UltraFine): Spotify, Messages.
[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace X'
[[on-window-detected]]
  if.app-id = 'com.apple.MobileSMS'
  run = 'move-node-to-workspace X'

# alt-c -> workspace C (LG UltraFine): Apple TV.
[[on-window-detected]]
  if.app-id = 'com.apple.TV'
  run = 'move-node-to-workspace C'

# alt-v -> workspace V (LG UltraFine): Safari.
[[on-window-detected]]
  if.app-id = 'com.apple.Safari'
  run = 'move-node-to-workspace V'

# alt-b -> workspace B (LG UltraFine): Netflix (Safari Web App).
[[on-window-detected]]
  # Bundle id is the installed Safari Web App; name is "Home - Netflix".
  if.app-id = 'com.apple.Safari.WebApp.127FB006-77AB-4A58-B61C-4FBAED3C4C06'
  run = 'move-node-to-workspace B'

# FaceTime call windows should float instead of participating in tiled layout.
[[on-window-detected]]
  if.app-id = 'com.apple.FaceTime'
  run = 'layout floating'

# Codex: 1st window → workspace 1, 2nd → 2, … (DELL S3225QC 1–9). Cursor: Q,W,E,… (Retina Q/W/E project row).
[[on-window-detected]]
  if.app-id = 'com.openai.codex'
  run = [
    'exec-and-forget ${HOME}/code/machine/scripts/aerospace-stagger-app-window.sh --app-id com.openai.codex --workspaces 1,2,3,4,5,6,7,8,9',
  ]
[[on-window-detected]]
  if.app-id = 'com.todesktop.230313mzl4w4u92'
  run = [
    'exec-and-forget ${HOME}/code/machine/scripts/aerospace-stagger-app-window.sh --app-id com.todesktop.230313mzl4w4u92 --workspaces Q,W,E',
  ]

# Workspace names match the alt-key that focuses them. Rows stay on the same monitors:
#   Project slots (sync alt-1…5 → Dell + Retina qwert only):
#     1/q -> 1/Q   2/w -> 2/W   3/e -> 3/E   4/r -> 4/R   5/t -> 5/T
#     alt-1…5 sync order: Retina, then Dell (Dell focused last)
#   DELL S3225QC:      1–9 (alt-1…9); alt-ctrl-1…5 = Dell-only (non-sync)
#   Built-in Retina:   Q,W,E,R,T (alt-q…t); N,M,comma (alt-n,m,comma) — non-project
#   LG UltraFine:      A,S,D,F,G (alt-a…g); Z,X,C,V,B (alt-z,x,c,v,b) — apps on ZXCVB
#   App auto-assign:   a->A Tao Studio; z->Z Chrome/sim; x->X Spotify/SMS; c->C Apple TV; v->V Safari; b->B Netflix
[workspace-to-monitor-force-assignment]
  1 = 'DELL S3225QC'
  2 = 'DELL S3225QC'
  3 = 'DELL S3225QC'
  4 = 'DELL S3225QC'
  5 = 'DELL S3225QC'
  6 = 'DELL S3225QC'
  7 = 'DELL S3225QC'
  8 = 'DELL S3225QC'
  9 = 'DELL S3225QC'
  Q = 'Built-in Retina Display'
  W = 'Built-in Retina Display'
  E = 'Built-in Retina Display'
  R = 'Built-in Retina Display'
  T = 'Built-in Retina Display'
  N = 'Built-in Retina Display'
  M = 'Built-in Retina Display'
  # alt-comma; AeroSpace key name, not a letter.
  comma = 'Built-in Retina Display'
  A = 'LG UltraFine'
  S = 'LG UltraFine'
  D = 'LG UltraFine'
  F = 'LG UltraFine'
  G = 'LG UltraFine'
  Z = 'LG UltraFine'
  X = 'LG UltraFine'
  C = 'LG UltraFine'
  V = 'LG UltraFine'
  B = 'LG UltraFine'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
[gaps]
  inner.horizontal = 0
  inner.vertical = 0
  outer.left = 0
  outer.bottom = 0
  outer.top = 0
  outer.right = 0

# 'main' binding mode declaration
[mode.main.binding]

  # --- General (non-workspace) ---
  # Service mode (alt-;), Open iTerm, Fullscreen, Toggle focused-window floating, Toggle layout, Tab workspace, Toggle monitor move, Reload config
  alt-semicolon = ['mode service']
  alt-enter = ['exec-and-forget open -na iTerm']
  alt-shift-enter = ["fullscreen"]
  alt-backtick = ['layout floating tiling']
  alt-slash = ['layout tiles horizontal vertical']
  alt-period = ['layout accordion horizontal vertical']
  alt-tab = ['workspace-back-and-forth']
  alt-shift-tab = ['move-workspace-to-monitor --wrap-around next']
  alt-shift-backtick = ['reload-config']

  # --- Tiling: focus / move / resize ---
  alt-h = ['focus left']
  alt-j = ['focus down']
  alt-k = ['focus up']
  alt-l = ['focus right']
  alt-shift-h = ['move left']
  alt-shift-j = ['move down']
  alt-shift-k = ['move up']
  alt-shift-l = ['move right']
  alt-minus = ['resize smart -75']
  alt-equal = ['resize smart +75']

  # --- Project sync: alt-1…5 → Retina + Dell (Dell focused last); alt-ctrl-1…5 = Dell-only ---
  alt-1 = ['workspace Q', 'workspace 1']
  alt-shift-1 = ['move-node-to-workspace 1', 'workspace Q', 'workspace 1']
  alt-shift-ctrl-1 = ['move-node-to-workspace 1']
  alt-ctrl-1 = ['workspace 1']
  alt-2 = ['workspace W', 'workspace 2']
  alt-shift-2 = ['move-node-to-workspace 2', 'workspace W', 'workspace 2']
  alt-shift-ctrl-2 = ['move-node-to-workspace 2']
  alt-ctrl-2 = ['workspace 2']
  alt-3 = ['workspace E', 'workspace 3']
  alt-shift-3 = ['move-node-to-workspace 3', 'workspace E', 'workspace 3']
  alt-shift-ctrl-3 = ['move-node-to-workspace 3']
  alt-ctrl-3 = ['workspace 3']
  alt-4 = ['workspace R', 'workspace 4']
  alt-shift-4 = ['move-node-to-workspace 4', 'workspace R', 'workspace 4']
  alt-shift-ctrl-4 = ['move-node-to-workspace 4']
  alt-ctrl-4 = ['workspace 4']
  alt-5 = ['workspace T', 'workspace 5']
  alt-shift-5 = ['move-node-to-workspace 5', 'workspace T', 'workspace 5']
  alt-shift-ctrl-5 = ['move-node-to-workspace 5']
  alt-ctrl-5 = ['workspace 5']

  # --- Focus window <Number DFS> ---
  alt-ctrl-6 = ['focus --dfs-index 5']
  alt-ctrl-7 = ['focus --dfs-index 6']
  alt-ctrl-8 = ['focus --dfs-index 7']
  alt-ctrl-9 = ['focus --dfs-index 8']
  alt-ctrl-0 = ['focus --dfs-index 9']

  # --- DELL S3225QC: workspaces 6–9 (alt = focus, alt-shift = move window + focus, alt-shift-ctrl = move window only) ---
  alt-6 = ['workspace 6']
  alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
  alt-shift-ctrl-6 = ['move-node-to-workspace 6']
  alt-7 = ['workspace 7']
  alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
  alt-shift-ctrl-7 = ['move-node-to-workspace 7']
  alt-8 = ['workspace 8']
  alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
  alt-shift-ctrl-8 = ['move-node-to-workspace 8']
  alt-9 = ['workspace 9']
  alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
  alt-shift-ctrl-9 = ['move-node-to-workspace 9']

  # --- Built-in Retina Display: QWERT row -> workspaces Q,W,E,R,T
  # Y/U/I/O keep monitor and workspace-cycle controls below.
  alt-q = ['workspace Q']
  alt-shift-q = ['move-node-to-workspace Q', 'workspace Q']
  alt-shift-ctrl-q = ['move-node-to-workspace Q']
  alt-w = ['workspace W']
  alt-shift-w = ['move-node-to-workspace W', 'workspace W']
  alt-shift-ctrl-w = ['move-node-to-workspace W']
  alt-e = ['workspace E']
  alt-shift-e = ['move-node-to-workspace E', 'workspace E']
  alt-shift-ctrl-e = ['move-node-to-workspace E']
  alt-r = ['workspace R']
  alt-shift-r = ['move-node-to-workspace R', 'workspace R']
  alt-shift-ctrl-r = ['move-node-to-workspace R']
  alt-t = ['workspace T']
  alt-shift-t = ['move-node-to-workspace T', 'workspace T']
  alt-shift-ctrl-t = ['move-node-to-workspace T']

  # --- LG UltraFine: ASDFG row -> workspaces A,S,D,F,G
  # H/J/K/L keep directional focus and move controls above.
  alt-a = ['workspace A']
  alt-shift-a = ['move-node-to-workspace A', 'workspace A']
  alt-shift-ctrl-a = ['move-node-to-workspace A']
  alt-s = ['workspace S']
  alt-shift-s = ['move-node-to-workspace S', 'workspace S']
  alt-shift-ctrl-s = ['move-node-to-workspace S']
  alt-d = ['workspace D']
  alt-shift-d = ['move-node-to-workspace D', 'workspace D']
  alt-shift-ctrl-d = ['move-node-to-workspace D']
  alt-f = ['workspace F']
  alt-shift-f = ['move-node-to-workspace F', 'workspace F']
  alt-shift-ctrl-f = ['move-node-to-workspace F']
  alt-g = ['workspace G']
  alt-shift-g = ['move-node-to-workspace G', 'workspace G']
  alt-shift-ctrl-g = ['move-node-to-workspace G']

  # --- LG UltraFine: ZXCVB row -> workspaces Z,X,C,V,B
  alt-z = ['workspace Z']
  alt-shift-z = ['move-node-to-workspace Z', 'workspace Z']
  alt-shift-ctrl-z = ['move-node-to-workspace Z']
  alt-x = ['workspace X']
  alt-shift-x = ['move-node-to-workspace X', 'workspace X']
  alt-shift-ctrl-x = ['move-node-to-workspace X']
  alt-c = ['workspace C']
  alt-shift-c = ['move-node-to-workspace C', 'workspace C']
  alt-shift-ctrl-c = ['move-node-to-workspace C']
  alt-v = ['workspace V']
  alt-shift-v = ['move-node-to-workspace V', 'workspace V']
  alt-shift-ctrl-v = ['move-node-to-workspace V']
  alt-b = ['workspace B']
  alt-shift-b = ['move-node-to-workspace B', 'workspace B']
  alt-shift-ctrl-b = ['move-node-to-workspace B']

  # --- Built-in Retina Display: NM, row -> workspaces N, M, comma
  alt-n = ['workspace N']
  alt-shift-n = ['move-node-to-workspace N', 'workspace N']
  alt-shift-ctrl-n = ['move-node-to-workspace N']
  alt-m = ['workspace M']
  alt-shift-m = ['move-node-to-workspace M', 'workspace M']
  alt-shift-ctrl-m = ['move-node-to-workspace M']
  alt-comma = ['workspace comma']
  alt-shift-comma = ['move-node-to-workspace comma', 'workspace comma']
  alt-shift-ctrl-comma = ['move-node-to-workspace comma']

  # --- Focused monitor: cycle workspaces (I/U) ---
  alt-i = ['workspace --wrap-around next']
  alt-shift-i = ['move-node-to-workspace --wrap-around next', 'workspace --wrap-around next']
  alt-shift-ctrl-i = ['move-node-to-workspace --wrap-around next']
  alt-u = ['workspace --wrap-around prev']
  alt-shift-u = ['move-node-to-workspace --wrap-around prev', 'workspace --wrap-around prev']
  alt-shift-ctrl-u = ['move-node-to-workspace --wrap-around prev']

  # --- Monitors: focus (O/Y); swap prev/next to match display arrangement ---
  alt-o = ['focus-monitor --wrap-around prev']
  alt-shift-o = ['move-node-to-monitor --focus-follows-window --wrap-around prev']
  alt-y = ['focus-monitor --wrap-around next']
  alt-shift-y = ['move-node-to-monitor --focus-follows-window --wrap-around next']

[mode.service.binding]
  r = ['reload-config', 'mode main']
  esc = ['flatten-workspace-tree', 'mode main']              # reset layout
  f = ['layout floating tiling', 'mode main']                # Toggle between floating and tiling layout
  backspace = ['close-all-windows-but-current', 'mode main']

  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']

  # Notes and info
  ################

  # [mode.main.binding]
  # All possible keys:
  # - Letters.        a, b, c, ..., z
  # - Numbers.        0, 1, 2, ..., 9
  # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
  # - F-keys.         f1, f2, ..., f20
  # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
  #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
  #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
  #                   sectionSign (ISO keyboards only, european keyboards only)
  # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
  #                   keypadMinus, keypadMultiply, keypadPlus
  # - Arrows.         left, down, up, right

  # All possible modifiers: cmd, alt, ctrl, shift

  # All possible commands: https://nikitabobko.github.io/AeroSpace/commands
